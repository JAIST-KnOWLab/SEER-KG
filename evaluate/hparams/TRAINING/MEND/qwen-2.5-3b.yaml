# =========================
# Model
# =========================
model_name: ./hugging_cache/qwen2.5-3b-instruct
model_class: AutoModelForCausalLM
tokenizer_class: AutoTokenizer
tokenizer_name: ./hugging_cache/qwen2.5-3b-instruct

# Train from scratch (do NOT load checkpoint)
archive: null


# =========================
# Edit target parameters (top layers of Qwen2.5-3B)
# Qwen2.5-3B has 32 layers → indices 0–31
# =========================
inner_params:
- model.layers.29.mlp.gate_proj.weight
- model.layers.29.mlp.up_proj.weight
- model.layers.29.mlp.down_proj.weight
- model.layers.30.mlp.gate_proj.weight
- model.layers.30.mlp.up_proj.weight
- model.layers.30.mlp.down_proj.weight
- model.layers.31.mlp.gate_proj.weight
- model.layers.31.mlp.up_proj.weight
- model.layers.31.mlp.down_proj.weight


# =========================
# Method (MEND)
# =========================
alg: MEND
seed: 42

# Learning rates (stable defaults)
lr: 1e-6
edit_lr: 5e-5
lr_lr: 1e-5

# Loss weights
cedit: 1.0
cloc: 1.0
cbase: 1.0

dropout: 0.0
train_base: False
no_grad_layers: null
one_sided: False


# =========================
# Editor architecture
# Qwen2.5-3B hidden size = 2048
# =========================
n_hidden: 1
hidden_dim: 2048
init: id
norm: True
combine: True
x_only: False
delta_only: False
act: relu

# Low-rank editor
rank: 256          # safer than 512 for 3B model
mlp_class: IDMLP
shared: True


# =========================
# Training
# =========================
device: cuda:0
batch_size: 1
accumulate_bs: 1

silent: False

max_epochs: 1
max_iters: 200

opt: Adam
grad_clip: 1.0

log_interval: 100
eval_log_interval: 500
val_interval: 100
model_save_pt: 1000

early_stop_patience: 5000
early_stop_key: "edit/acc_val"

eval_only: False
final_eval: True

half: False
debug: False
save: True
verbose: True

val_batch_size: 1
val_steps: 100


# =========================
# Output
# =========================
results_dir: ./results
