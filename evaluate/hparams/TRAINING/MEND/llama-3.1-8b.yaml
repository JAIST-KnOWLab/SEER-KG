# =========================
# Model
# =========================
model_name: ./hugging_cache/llama-3.1-8b-instruct
model_class: AutoModelForCausalLM
tokenizer_class: AutoTokenizer
tokenizer_name: ./hugging_cache/llama-3.1-8b-instruct

# Edit only top layers (safe choice)
inner_params:
- model.layers.13.mlp.gate_proj.weight
- model.layers.13.mlp.up_proj.weight
- model.layers.13.mlp.down_proj.weight
- model.layers.14.mlp.gate_proj.weight
- model.layers.14.mlp.up_proj.weight
- model.layers.14.mlp.down_proj.weight
- model.layers.15.mlp.gate_proj.weight
- model.layers.15.mlp.up_proj.weight
- model.layers.15.mlp.down_proj.weight

archive: null


# =========================
# Method (MEND)
# =========================
alg: MEND

seed: 42

# Learning rates
lr: 1e-6
edit_lr: 5e-5
lr_lr: 1e-5

# Loss weights (balanced and stable)
cedit: 1.0
cloc: 1.0
cbase: 1.0

dropout: 0.0
train_base: False
no_grad_layers: null

one_sided: False

# Editor architecture
n_hidden: 1
hidden_dim: 2048      # IMPORTANT: must match LLaMA-3.2 hidden size
init: id
norm: True
combine: True
x_only: False
delta_only: False

act: relu

# Low-rank editor (safe value)
rank: 256              # Safe and widely used
mlp_class: IDMLP
shared: True


# =========================
# Training
# =========================
device: cuda:0
batch_size: 1
accumulate_bs: 1

silent: False

max_epochs: 1
max_iters: 5000

opt: Adam
grad_clip: 1.0

log_interval: 100
eval_log_interval: 500
val_interval: 1000

model_save_pt: 1000

early_stop_patience: 5000
early_stop_key: "edit/acc_val"

eval_only: False
final_eval: True

half: False
debug: False
save: True
verbose: True

val_batch_size: 1
val_steps: 100


# =========================
# Output
# =========================
results_dir: ./results
