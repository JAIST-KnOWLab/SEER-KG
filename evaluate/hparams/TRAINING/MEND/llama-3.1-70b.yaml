model_class: LlamaForCausalLM # AutoModelForCausalLM 
tokenizer_class: AutoTokenizer # LlamaTokenizer
tokenizer_name: ./hugging_cache/llama-3.1-70b-instruct  # ./hugging_cache/llama-2-7b 
model_parallel: True
disable_quantization: True
inner_params:
