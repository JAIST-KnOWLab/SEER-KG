archive: null

# Method
alg: MEND
lr: 1e-6
edit_lr: 1e-4
lr_lr: 1e-4
seed: 42
cedit: 0.1
cloc: 1.0
cbase: 1.0
dropout: 0.0
train_base: False
no_grad_layers: null
one_sided: True
n_hidden: 1
hidden_dim: null
init: id
norm: True
combine: False
x_only: False
delta_only: False
act: relu
rank: 64
mlp_class: IDMLP
shared: True

# Train
device: cuda:0
batch_size: 1
model_save_pt: 5000
silent: False
max_epochs: 1 # #
max_iters: 10000 # 0
log_interval: 1000
eval_log_interval: 1000
final_eval: True
val_interval: 5000
early_stop_patience: 30000
early_stop_key: "edit/acc_val"
eval_only: False
half: False
debug: False
save: False
verbose: True

val_batch_size: 1
accumulate_bs: 1 # 2
val_steps: 500 # only for debug
opt: Adam
grad_clip: 100.

# Output

results_dir: ./results